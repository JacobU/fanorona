<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanorona Board</title>
    <style>
        /* Remove default margin and set up flexbox on body */
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Make the body take up the full viewport height */
        }

        /* Ensure the canvas and grid container are properly aligned */
        #canvas-container {
            position: relative;
            width: 900px;
            height: 500px;
        }

        /* Row under the board for controls, with the End turn button on the right */
        #board-controls {
            width: 900px;
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
            margin-bottom: 20px;
        }

        /* Wooden buttons (End turn and Play Again). The border and text use the dark brown from the edge of the dark pieces. */
        .wood-button {
            padding: 10px 22px;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 16px;
            font-weight: bold;
            color: #a57e5a;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
            background: url('./assets/svg/wood.svg') center / cover;
            border: 2px solid #a57e5a;
            border-radius: 6px;
            cursor: pointer;
            transition: filter 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
        }

        .wood-button:hover {
            filter: brightness(0.9);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .wood-button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
        }

        /* The End turn button is only made visible when the player can stop a capture chain,
           and keeps its space when hidden so the page doesn't jump around. */
        #end-turn-button {
            visibility: hidden;
        }

        #end-turn-button.visible {
            visibility: visible;
        }

        /* Optional: Add border for better visibility of the canvas */
        #fanoronaBoard {
            z-index: 1;
        }

        /* Grid container */
        .grid-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            max-width: 900px;
            background: transparent;
            border: none;
            display: grid;
            grid-template-columns: repeat(9, 1fr); /* 9 columns */
            grid-template-rows: repeat(5, 1fr); /* 5 rows */
            z-index: 2; /* Grid is above the canvas */
        }
    
        /* Buttons in the grid */
        .grid-container button {
            width: 100%;
            height: 100%;
            cursor: pointer;
            background: transparent;
            aspect-ratio: 1 / 1;
            border: none;
            outline: none;
            transition: background 0.2s ease;
            position: relative; /* Required for positioning ::after */
            overflow: hidden; /* Ensures the circle stays within the button bounds */
        }

        /* Add circular hover effect */
        .grid-container button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0; /* Circle starts with 0 radius */
            height: 0;
            background: rgba(255, 255, 255, 0.4); /* Semi-transparent color */
            border-radius: 50%; /* Makes the shape a circle */
            transform: translate(-50%, -50%);
            transition: width 0.2s ease, height 0.2s ease; /* Smooth growth */
        }
        
        /* Expand the circle only for the hovered button */
        .grid-container button:hover::after {
            width: 50px; /* Radius of the circle */
            height: 50px;
            opacity: 1;
        }


        .grid-container button.possibleMove::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px; /* Match the hover effect size */
            height: 50px;
            background: rgba(79, 195, 247, 0.2);
            border-radius: 50%; /* Makes the shape a circle */
            transform: translate(-50%, -50%);
            opacity: 1; /* Ensure it's visible */
            transition: width 0.2s ease, height 0.2s ease; /* Smooth growth */
        }

        .grid-container button.moveablePiece::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%; /* Slightly larger than the piece */
            height: 50%; /* Matches the width */
            border: 4px solid rgba(79, 195, 247, 0.6); /* Ring color */
            border-radius: 50%; /* Circular shape */
            transform: translate(-50%, -50%) scale(1); /* Centered and starts at default scale */
            z-index: -1; /* Behind the piece */
            animation: pulse 1s infinite; /* Pulsating effect */
        }
        
        .grid-container button.approachOrWithdraw::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%; /* Slightly larger than the piece */
            height: 50%; /* Matches the width */
            border: 4px solid rgba(247, 79, 79, 0.6); /* Ring color */
            border-radius: 50%; /* Circular shape */
            transform: translate(-50%, -50%) scale(1); /* Centered and starts at default scale */
            z-index: -1; /* Behind the piece */
            animation: pulse 1s infinite; /* Pulsating effect */
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1); /* Start at normal size */
                opacity: 0.8; /* Visible */
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15); /* Slightly larger halo */
                opacity: 0.4; /* Slightly transparent */
            }
            100% {
                transform: translate(-50%, -50%) scale(1.3); /* Return to original size */
                opacity: 0; /* Fade out */
            }
        }

        #message-container {
            display: none; /* Initially hidden */
            align-items: center;
            justify-content: center;
            width: 900px;
            height: 100px;
            margin: 20px auto;
            background-color: #f9f5f0;
            border: 2px solid #e0d6cc;
            border-radius: 10px; /* Rounded edges for elegance */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
        }
        
        /* "You won!" / "You lost!" message, in the same font and dark brown as the buttons */
        #game-message {
            flex-grow: 1;
            text-align: center;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #a57e5a;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
        }

        #play-again-button {
            margin-right: 20px;
        }

    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="fanoronaBoard" width="900" height="500"></canvas>
        <div class="grid-container">
            <!-- Generate 9x5 grid buttons -->
            <script>
            for (let i = 0; i < 45; i++) {
                document.write(`<button id="btn-${i}"></button>`);
            }
            </script>
        </div>
    </div>

    <div id="board-controls">
        <button id="end-turn-button" class="wood-button">End turn</button>
    </div>

    <div id="message-container" style="display: none;">
        <p id="game-message"></p>
        <button id="play-again-button" class="wood-button">Play Again</button>
    </div>
    
    <script type="module" src="./bundle.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanorona Board</title>
    <style>
        /* Shared look for the buttons and text: Georgia small capitals in dark grey, with the "framed" style
           (a double border like a picture frame) in the board's light colours */
        :root {
            --ui-font: Georgia, 'Times New Roman', serif;
            --ui-text: #555555;
            --frame-outer: #d8cdbf;
            --frame-inner: #e4dccc;
            --frame-fill: #f9f5f0;
        }

        /* Remove default margin and set up flexbox on body */
        body {
            font-family: var(--ui-font);
            color: var(--ui-text);
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Make the body take up the full viewport height */
        }

        /* Ensure the canvas and grid container are properly aligned */
        #canvas-container {
            position: relative;
            width: 900px;
            height: 500px;
        }

        /* Elements with the hidden attribute are never shown (even if a rule below gives them a display) */
        [hidden] {
            display: none !important;
        }

        /* Row above the board: the vs Bot / 2 Player choice before a game, and whose turn it is during one.
           It has a fixed height so the board doesn't move when its contents change. */
        #top-controls {
            width: 900px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        #mode-choice, #difficulty-choice, #colour-choice {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Whose turn it is, in the same small capitals as the buttons */
        #turn-indicator {
            margin: 0;
            font-family: var(--ui-font);
            font-size: 18px;
            font-weight: bold;
            font-variant: small-caps;
            letter-spacing: 2px;
            color: var(--ui-text);
        }

        /* Row under the board for controls, with Restart on the left and End turn on the right */
        #board-controls {
            width: 900px;
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            margin-bottom: 20px;
        }

        /* Framed buttons: a flat cream fill inside a double border. The inner line is drawn with two inset shadows:
           the first (in the fill colour) leaves a small gap inside the outer border, the second draws the line. */
        .board-button {
            --button-fill: var(--frame-fill);
            --button-inner: var(--frame-inner);
            padding: 10px 22px;
            font-family: var(--ui-font);
            font-size: 14px;
            font-weight: bold;
            font-variant: small-caps;
            letter-spacing: 2px;
            color: var(--ui-text);
            background: var(--button-fill);
            border: 2px solid var(--frame-outer);
            border-radius: 4px;
            box-shadow: inset 0 0 0 3px var(--button-fill), inset 0 0 0 4.5px var(--button-inner);
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
        }

        .board-button:hover {
            --button-fill: #f3ebdf;
        }

        .board-button:active {
            --button-fill: #ece2d4;
            --button-inner: var(--frame-outer);
            transform: translateY(1px);
        }

        /* A smaller button (e.g. Back) */
        .board-button.small {
            padding: 6px 14px;
            font-size: 12px;
        }

        /* Greyed out and unclickable, e.g. Restart while the bot is moving */
        .board-button.is-disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* The End turn button is only made visible when the player can stop a capture chain,
           and keeps its space when hidden so the page doesn't jump around. */
        #end-turn-button {
            visibility: hidden;
        }

        #end-turn-button.visible {
            visibility: visible;
        }

        /* Restart is only shown during a game, and also keeps its space when hidden */
        #restart-button {
            visibility: hidden;
        }

        #restart-button.visible {
            visibility: visible;
        }

        /* Optional: Add border for better visibility of the canvas */
        #fanoronaBoard {
            z-index: 1;
        }

        /* Grid container */
        .grid-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            max-width: 900px;
            background: transparent;
            border: none;
            display: grid;
            grid-template-columns: repeat(9, 1fr); /* 9 columns */
            grid-template-rows: repeat(5, 1fr); /* 5 rows */
            z-index: 2; /* Grid is above the canvas */
        }
    
        /* Buttons in the grid */
        .grid-container button {
            width: 100%;
            height: 100%;
            cursor: pointer;
            background: transparent;
            aspect-ratio: 1 / 1;
            border: none;
            outline: none;
            transition: background 0.2s ease;
            position: relative; /* Required for positioning ::after */
            overflow: hidden; /* Ensures the circle stays within the button bounds */
        }

        /* Add circular hover effect */
        .grid-container button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0; /* Circle starts with 0 radius */
            height: 0;
            background: rgba(255, 255, 255, 0.4); /* Semi-transparent color */
            border-radius: 50%; /* Makes the shape a circle */
            transform: translate(-50%, -50%);
            transition: width 0.2s ease, height 0.2s ease; /* Smooth growth */
        }
        
        /* Expand the circle only for the hovered button */
        .grid-container button:hover::after {
            width: 50px; /* Radius of the circle */
            height: 50px;
            opacity: 1;
        }


        .grid-container button.possibleMove::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px; /* Match the hover effect size */
            height: 50px;
            background: rgba(79, 195, 247, 0.2);
            border-radius: 50%; /* Makes the shape a circle */
            transform: translate(-50%, -50%);
            opacity: 1; /* Ensure it's visible */
            transition: width 0.2s ease, height 0.2s ease; /* Smooth growth */
        }

        .grid-container button.moveablePiece::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%; /* Slightly larger than the piece */
            height: 50%; /* Matches the width */
            border: 4px solid rgba(79, 195, 247, 0.6); /* Ring color */
            border-radius: 50%; /* Circular shape */
            transform: translate(-50%, -50%) scale(1); /* Centered and starts at default scale */
            z-index: -1; /* Behind the piece */
            animation: pulse 1s infinite; /* Pulsating effect */
        }
        
        .grid-container button.approachOrWithdraw::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%; /* Slightly larger than the piece */
            height: 50%; /* Matches the width */
            border: 4px solid rgba(247, 79, 79, 0.6); /* Ring color */
            border-radius: 50%; /* Circular shape */
            transform: translate(-50%, -50%) scale(1); /* Centered and starts at default scale */
            z-index: -1; /* Behind the piece */
            animation: pulse 1s infinite; /* Pulsating effect */
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1); /* Start at normal size */
                opacity: 0.8; /* Visible */
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15); /* Slightly larger halo */
                opacity: 0.4; /* Slightly transparent */
            }
            100% {
                transform: translate(-50%, -50%) scale(1.3); /* Return to original size */
                opacity: 0; /* Fade out */
            }
        }

        #message-container {
            display: none; /* Initially hidden */
            align-items: center;
            justify-content: center;
            width: 900px;
            height: 100px;
            margin: 20px auto;
            background-color: var(--frame-fill);
            /* The same double frame as the buttons */
            border: 2px solid var(--frame-outer);
            border-radius: 4px;
            box-shadow: inset 0 0 0 4px var(--frame-fill), inset 0 0 0 5.5px var(--frame-inner), 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        /* "You won!" / "You lost!" message, in the same small capitals as the buttons */
        #game-message {
            flex-grow: 1;
            text-align: center;
            font-family: var(--ui-font);
            font-size: 24px;
            font-weight: bold;
            font-variant: small-caps;
            letter-spacing: 2px;
            color: var(--ui-text);
        }

    </style>
</head>
<body>
    <div id="top-controls">
        <div id="mode-choice">
            <button id="vs-bot-button" class="board-button">vs Bot</button>
            <button id="two-player-button" class="board-button">2 Player</button>
        </div>
        <!-- The difficulty buttons are added by index.ts, from the list of difficulties in ai/difficulties.ts -->
        <div id="difficulty-choice" hidden>
            <button id="difficulty-back-button" class="board-button small">Back</button>
        </div>
        <div id="colour-choice" hidden>
            <button id="play-white-button" class="board-button">Play as White</button>
            <button id="play-black-button" class="board-button">Play as Black</button>
            <button id="colour-back-button" class="board-button small">Back</button>
        </div>
        <p id="turn-indicator" hidden></p>
    </div>

    <div id="canvas-container">
        <canvas id="fanoronaBoard" width="900" height="500"></canvas>
        <div class="grid-container">
            <!-- Generate 9x5 grid buttons -->
            <script>
            for (let i = 0; i < 45; i++) {
                document.write(`<button id="btn-${i}"></button>`);
            }
            </script>
        </div>
    </div>

    <div id="board-controls">
        <button id="restart-button" class="board-button">Restart</button>
        <button id="end-turn-button" class="board-button">End turn</button>
    </div>

    <div id="message-container" style="display: none;">
        <p id="game-message"></p>
    </div>
    
    <script type="module" src="./bundle.js"></script>
</body>
</html>
